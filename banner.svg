<g fill="#b7b6c9" opacity=".3" font-family="monospace" font-size="14"><text x="90" y="240">const idea = "something useful";</text><text x="90" y="265">build(idea).ship().improve();</text><text x="1190" y="235">01 / DESIGN</text><text x="1190" y="260">02 / BUILD</text><text x="1190" y="285">03 / DEPLOY</text></g>
