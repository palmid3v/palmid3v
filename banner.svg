<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
<title id="title">PalmiD3v — Full-stack developer</title>
<desc id="desc">Dark developer banner with red and magenta neon accents, code-inspired details, and the message Building Digital Products.</desc>
<defs>
